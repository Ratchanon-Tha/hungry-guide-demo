<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cross-Subdomain Cookie POC</title>
</head>
<body>
  <h1>Subdomain A</h1>
  <p id="cookie-status">Checking cookie...</p>
  <button onclick="setCookie()">Set Cookie for .github.io</button>
  <a href="https://ratchanon-tha.github.io/hungry-guide-cookie-poc/index.html">Go to Subdomain B</a>

  <script>
    function setCookie() {
      // domain=.github.io allows sharing across all subdomains
      document.cookie = "sharedTheme=dark; path=/; domain=.github.io;";
      document.getElementById("cookie-status").innerText = "Cookie set: sharedTheme=dark";
    }

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    const theme = getCookie("sharedTheme");
    document.getElementById("cookie-status").innerText = theme
      ? "Cookie detected: sharedTheme=" + theme
      : "No cookie set yet";
  </script>
</body>
</html>
