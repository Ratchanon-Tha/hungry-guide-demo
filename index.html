<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cookie POC</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 10px; margin: 5px; cursor: pointer; }
    .banner { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="banner">
    <p id="cookie-status">Checking cookie...</p>
    <button onclick="setDarkTheme()">Set Dark Theme Cookie</button>
  </div>

  <div class="card" onclick="goToDetail(1)">Shop 1</div>
  <div class="card" onclick="goToDetail(2)">Shop 2</div>

  <script>
    function setDarkTheme() {
      document.cookie = "darkTheme=true; path=/;";
      document.getElementById("cookie-status").innerText = "Cookie set: darkTheme=true";
    }

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    function goToDetail(id) {
      window.location.href = "detail.html?shop=" + id;
    }

    // check cookie on load
    const darkTheme = getCookie("darkTheme");
    document.getElementById("cookie-status").innerText = darkTheme
      ? "Cookie detected: darkTheme=" + darkTheme
      : "No darkTheme cookie set";
  </script>
</body>
</html>
